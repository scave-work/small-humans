<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Humans</title>
<style>
  html,body{height:100%;margin:0;background:#0b0d12;color:#f4e3a1;font-family:system-ui,sans-serif}
  body{display:grid;place-items:center;text-align:center}
  h1{font-weight:300;letter-spacing:.3em;text-transform:uppercase;animation:glow 3s ease-in-out infinite alternate}
  p{opacity:.6}
  @keyframes glow{from{opacity:.35}to{opacity:1;text-shadow:0 0 24px #f4c542}}
</style>
</head>
<body>
<main><h1>Small Humans</h1><p>Il fait encore sombre ici. Bientôt.</p></main>
</body>
</html>
