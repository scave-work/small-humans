name: Ajouts cinema
# Le site (bouton « Envoyer ») dépose un fichier dans cinema/data/ajouts/ ; ce robot l'intègre au journal public puis le supprime.
on:
  push:
    paths:
      - 'cinema/data/ajouts/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ajouts-cinema
  cancel-in-progress: false
jobs:
  integrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Intégrer les ajouts au journal
        run: |
          shopt -s nullglob
          for f in cinema/data/ajouts/*.json; do
            python -I cinema/scripts/cinema_integrer.py "$f" --journal cinema/data/journal.json
            git rm -q "$f"
          done
      - name: Enregistrer
        run: |
          git config user.name "ajouts-cinema"
          git config user.email "actions@users.noreply.github.com"
          git add cinema/data/journal.json
          git diff --cached --quiet || (git commit -m "Cinema : ajouts integres au journal (envoi depuis le site)" && git pull --rebase && git push)
