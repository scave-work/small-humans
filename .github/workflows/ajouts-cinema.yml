name: Ajouts cinema
# Le site (bouton « Envoyer ») dépose un fichier dans cinema/data/ajouts/ ; ce robot l'intègre au journal public puis le supprime.
on:
  push:
    paths:
      - 'cinema/data/ajouts/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ajouts-cinema
  cancel-in-progress: false
jobs:
  integrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Intégrer et enregistrer (3 essais si deux envois se croisent)
        run: |
          git config user.name "ajouts-cinema"
          git config user.email "actions@users.noreply.github.com"
          shopt -s nullglob
          for essai in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            fichiers=(cinema/data/ajouts/*.json)
            [ ${#fichiers[@]} -eq 0 ] && exit 0
            for f in "${fichiers[@]}"; do
              python -I cinema/scripts/cinema_integrer.py "$f" --journal cinema/data/journal.json
              git rm -q "$f"
            done
            git add cinema/data/journal.json
            git commit -q -m "Cinema : ajouts integres au journal (envoi depuis le site)"
            git push -q origin HEAD:main && exit 0
            echo "Push refuse (un autre envoi est arrive), nouvel essai $essai"
          done
          exit 1
